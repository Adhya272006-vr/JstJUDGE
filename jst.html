<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Photo Rater — Prototype</title>
  <!-- Tailwind via CDN for quick styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FilePond for file upload -->
  <link href="https://unpkg.com/filepond@^4/dist/filepond.css" rel="stylesheet" />
  <script src="https://unpkg.com/filepond@^4/dist/filepond.js"></script>
  <!-- Chart.js for radar chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* Simple before/after slider styling */
    .ba-wrapper { position: relative; width: 100%; max-width: 720px; }
    .ba-img { display: block; width: 100%; }
    .ba-overlay { position: absolute; top:0; left:0; height:100%; overflow:hidden; }
    .ba-handle { position:absolute; top:0; bottom:0; width:3px; background:rgba(255,255,255,0.8); left:50%; transform:translateX(-50%); }
    .hidden { display:none; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">
  <div class="container mx-auto p-6">
    <header class="mb-6">
      <h1 class="text-3xl font-bold">jstJUDGE</h1>
      <p class="text-sm text-gray-600">Upload a photo, get category ratings, improvement suggestions and a preview of edits.</p>
    </header>

    <!-- Upload area -->
    <section class="mb-6">
      <input type="file" class="filepond" id="filepond" name="filepond" accept="image/*" />
      <div class="mt-3 flex gap-2">
        <button id="analyzeBtn" class="px-4 py-2 bg-blue-600 text-white rounded">Analyze Photo</button>
      </div>
    </section>

    <!-- Results grid -->
    <section id="results" class="grid grid-cols-1 md:grid-cols-3 gap-6 hidden">
      <!-- Ratings card -->
      <div class="col-span-1 bg-white p-4 rounded shadow">
        <h2 class="font-semibold mb-2">Ratings</h2>
        <div class="space-y-3">
          <div><strong>Background:</strong> <span id="rating-bg">—</span></div>
          <div><strong>Clarity:</strong> <span id="rating-clarity">—</span></div>
          <div><strong>Outfit:</strong> <span id="rating-outfit">—</span></div>
          <div><strong>Composition:</strong> <span id="rating-composition">—</span></div>
          <div class="mt-3"><strong>Overall:</strong> <span id="rating-overall">—</span></div>
        </div>
        <canvas id="radarChart" class="mt-4" height="220"></canvas>
      </div>

      <!-- Suggestions card -->
      <div class="col-span-1 bg-white p-4 rounded shadow">
        <h2 class="font-semibold mb-2">Improvement Suggestions</h2>
        <ul id="suggestions" class="list-disc ml-5 text-sm text-gray-700"></ul>
      </div>

      <!-- Preview card -->
      <div class="col-span-1 bg-white p-4 rounded shadow">
        <h2 class="font-semibold mb-2">Before / After Preview</h2>
        <div class="ba-wrapper">
          <img id="beforeImg" class="ba-img" src="" alt="Before" />
          <div id="overlay" class="ba-overlay" style="width:50%">
            <img id="afterImg" class="ba-img" src="" alt="After" />
          </div>
          <div id="handle" class="ba-handle"></div>
        </div>
        <input id="baRange" type="range" min="0" max="100" value="50" class="w-full mt-3">
      </div>
    </section>

    

    <footer class="mt-6 text-xs text-gray-500">Prototype: change endpoints & styles as needed.</footer>
  </div>

  <script>
    // Initialize FilePond
    const inputElement = document.querySelector('input[type="file"]');
    const pond = FilePond.create(inputElement, {allowMultiple: false});

    // Elements
    const analyzeBtn = document.getElementById('analyzeBtn');
    const applyEditsBtn = document.getElementById('applyEditsBtn');
    const downloadLink = document.getElementById('downloadLink');
    const resultsSection = document.getElementById('results');
    const suggestionsList = document.getElementById('suggestions');

    const beforeImg = document.getElementById('beforeImg');
    const afterImg = document.getElementById('afterImg');
    const overlay = document.getElementById('overlay');
    const handle = document.getElementById('handle');
    const baRange = document.getElementById('baRange');

    // Radar chart setup
    const ctx = document.getElementById('radarChart').getContext('2d');
    const radarChart = new Chart(ctx, {
      type: 'radar',
      data: {
        labels: ['Background','Clarity','Outfit','Composition'],
        datasets: [{ label: 'Scores', data: [0,0,0,0], fill: true }]
      },
      options: { scales: { r: { suggestedMin: 0, suggestedMax: 10 } } }
    });

    // Utility: convert FilePond file to Blob and ObjectURL
    async function getFileFromPond() {
      const item = pond.getFiles()[0];
      if(!item) return null;
      // If serverId exists (uploaded), pond returns server file reference — for prototype, use file object
      return item.file || null;
    }

    // Simulated analysis used as fallback
    function simulatedAnalysis(imageUrl) {
      // Random-ish but deterministic suggestions based on image size
      return new Promise(resolve => {
        setTimeout(() => {
          const bg = Math.floor(Math.random()*4)+6; // 6-9
          const clarity = Math.floor(Math.random()*5)+5; //5-9
          const outfit = Math.floor(Math.random()*3)+7; //7-9
          const comp = Math.floor(Math.random()*4)+6; //6-9
          const overall = Math.round(((bg+clarity+outfit+comp)/4)*10)/10;
          resolve({
            background: bg,
            clarity: clarity,
            outfit: outfit,
            composition: comp,
            overall: overall,
            suggestions: [
              'Try a subtle background blur to reduce distractions.',
              'Increase sharpness slightly (about +10).',
              'Slightly raise exposure or highlights for a cleaner look.'
            ],
            edited_image_url: imageUrl // prototype: same image as "edited"
          });
        }, 900);
      });
    }

    // Handle analyze
    analyzeBtn.addEventListener('click', async () => {
      const file = await getFileFromPond();
      if(!file) { alert('Please choose a photo first.'); return; }

      // Show loading state
      analyzeBtn.disabled = true; analyzeBtn.textContent = 'Analyzing...';

      // Create preview URL
      const objectUrl = URL.createObjectURL(file);
      beforeImg.src = objectUrl;
      afterImg.src = objectUrl; // will be replaced after edits

      // Attempt to call backend; if fails, use simulatedAnalysis
      try {
        const form = new FormData();
        form.append('photo', file);
        const resp = await fetch('/api/analyze', { method: 'POST', body: form });
        if(!resp.ok) throw new Error('no backend');
        const data = await resp.json();
        applyAnalysisResult(data);
      } catch (e) {
        console.warn('Backend analyze failed — using simulated analysis.', e);
        const data = await simulatedAnalysis(objectUrl);
        applyAnalysisResult(data);
      } finally {
        analyzeBtn.disabled = false; analyzeBtn.textContent = 'Analyze Photo';
      }
    });

    function applyAnalysisResult(data) {
      // Unhide results
      resultsSection.classList.remove('hidden');
      document.getElementById('rating-bg').textContent = data.background + '/10';
      document.getElementById('rating-clarity').textContent = data.clarity + '/10';
      document.getElementById('rating-outfit').textContent = data.outfit + '/10';
      document.getElementById('rating-composition').textContent = data.composition + '/10';
      document.getElementById('rating-overall').textContent = data.overall + '/10';

      // Update radar
      radarChart.data.datasets[0].data = [data.background, data.clarity, data.outfit, data.composition];
      radarChart.update();

      // Suggestions
      suggestionsList.innerHTML = '';
      (data.suggestions || []).forEach(s => {
        const li = document.createElement('li'); li.textContent = s; suggestionsList.appendChild(li);
      });

      // After image either from backend or fallback
      if (data.edited_image_url) {
        afterImg.src = data.edited_image_url;
      }

      applyEditsBtn.disabled = false;
    }

    // Apply edits button (calls backend or fakes it)
    applyEditsBtn.addEventListener('click', async () => {
      applyEditsBtn.disabled = true; applyEditsBtn.textContent = 'Applying edits...';
      const file = await getFileFromPond(); if(!file) return;

      try {
        const form = new FormData();
        form.append('photo', file);
        form.append('edits', JSON.stringify({ auto: true }));
        const resp = await fetch('/api/apply-edits', { method: 'POST', body: form });
        if(!resp.ok) throw new Error('no backend');
        const data = await resp.blob();
        const url = URL.createObjectURL(data);
        afterImg.src = url;
        downloadLink.href = url; downloadLink.classList.remove('hidden');
      } catch (e) {
        // prototype: fallback — just copy original image to "edited"
        console.warn('Backend apply-edits failed — using original image as "edited"', e);
        const fileObjUrl = URL.createObjectURL(file);
        afterImg.src = fileObjUrl;
        downloadLink.href = fileObjUrl; downloadLink.classList.remove('hidden');
      } finally {
        applyEditsBtn.disabled = false; applyEditsBtn.textContent = 'Apply Suggested Edits';
      }
    });

    // Before/After slider behavior
    baRange.addEventListener('input', (e) => {
      const val = e.target.value; overlay.style.width = val + '%'; handle.style.left = val + '%';
    });

    // Initialize with center handle
    overlay.style.width = '50%'; handle.style.left = '50%';

  </script>
</body>
</html>
